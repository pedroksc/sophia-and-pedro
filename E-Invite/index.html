<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sophia and Pedro wedding invitation">
    <meta property="og:title" content="Sophia & Pedro | Wedding Invitation">
    <meta property="og:description" content="Join us on November 7, 2026 in Apopka, Florida.">
    <meta property="og:image" content="https://pedroksc.github.io/sophia-and-pedro/E-Invite/images/pedrosophia.jpeg">
    <meta property="og:url" content="https://pedroksc.github.io/sophia-and-pedro/E-Invite/index.html">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sophia & Pedro | Wedding Invitation">
    <meta name="twitter:description" content="Join us on November 7, 2026 in Apopka, Florida.">
    <meta name="twitter:image" content="https://pedroksc.github.io/sophia-and-pedro/E-Invite/images/pedrosophia.jpeg">
    <title>Sophia & Pedro | Wedding Invitation</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="invitation-microsite">

        <!-- Elegant background area -->
        <section class="scene">

            <!-- Optional decorative background layers -->
            <div class="background">
                <div class="background-overlay"></div>
                <div class="background-decor background-decor-top"></div>
                <div class="background-decor background-decor-bottom"></div>
            </div>

            <!-- Envelope experience -->
            <section class="envelope-stage" aria-label="Wedding invitation envelope">

                <div class="envelope">

                    <!-- Back of envelope -->
                    <div class="envelope-back"></div>

                    <!-- Invitation card inside envelope -->
                    <article class="invitation-card">

                        <div class="invitation-artwork">

                            <!-- Invitation photo background -->
                            <div class="invitation-photo-background">
                                <img src="images/einvite.png" alt="Sophia and Pedro" class="invitation-background-image">
                            </div>

                            <a 
                                href="https://www.zola.com/wedding/pedroandsophia2026"
                                class="rsvp-hotspot"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="Wedding Details and RSVP"
                            >
                                <span class="visually-hidden">
                                    Wedding Details and RSVP
                                </span>

                            </a>

                        </div>
                        <div class="invitation-photo-overlay"></div>

                    </article>

                    <!-- Front parts of envelope -->
                    <div class="envelope-front"></div>
                    <div class="envelope-left-fold"></div>
                    <div class="envelope-right-fold"></div>
                    <div class="envelope-bottom-fold"></div>
                    <div class="envelope-flap"></div>

                    <!-- Wax seal button/image placeholder -->
                    <button
                        type="button"
                        class="wax-seal"
                        aria-label="Open wedding invitation"
                    >
                        <!-- Replace this image path with your wax seal image -->
                        <img
                            src="images/seal.png"
                            alt="Wax seal"
                            class="wax-seal-image"
                        >
                    </button>

                </div>

            </section>

        </section>

    </main>

</body>
</html>
